buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        // NOTE 26 is the floor for react-native-health-connect (androidx.health.connect). The
        // library reads this ext value, so leaving it at 24 would let the build through and fail
        // at manifest merge instead. Raising it drops Android 7.x devices.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Required by @react-native-async-storage/async-storage v3 (local Maven repo
// containing org.asyncstorage.shared_storage:storage-android, not on Maven Central).
allprojects {
    repositories {
        maven {
            url = uri(project(":react-native-async-storage_async-storage").file("local_repo"))
        }
    }

    // react-native-video is compiled against media3 1.8.0. Another transitive dependency
    // (e.g. react-native-vision-camera) pulls the group up to 1.9.0, which removed the
    // DefaultLoadControl constructor that RNVLoadControl calls → NoSuchMethodError crash.
    // Pin the whole group so all modules resolve to the version RNV was built against.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.media3') {
                details.useVersion '1.8.0'
                details.because 'react-native-video requires media3 1.8.0'
            }
        }
    }
}
